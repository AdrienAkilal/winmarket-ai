[pytest]
# Pytest configuration for WinMarket AI

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, multi-component)
    e2e: End-to-end tests (full pipeline)
    extraction: Tests for AO extraction
    scoring: Tests for scoring engine
    slow: Slow tests (>1 second)
    requires_external_api: Tests requiring external API (Pappers, Claude)

# Coverage options
[coverage:run]
branch = True
source = src

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Exclude patterns
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
